name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build and attach the release binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Install the musl linker
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends musl-tools

      - name: Build the static binary
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Name and hash the asset
        run: |
          cp target/x86_64-unknown-linux-musl/release/grammachy grammachy-x86_64-linux
          sha256sum grammachy-x86_64-linux > grammachy-x86_64-linux.sha256

      - name: Attach the asset to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cli/grammachy-x86_64-linux
            cli/grammachy-x86_64-linux.sha256
