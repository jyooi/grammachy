[package]
name = "grammachy"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
description = "Companion CLI for the Grammachy Omarchy plugin"
license = "MIT"
publish = false

[[bin]]
name = "grammachy"
path = "src/main.rs"

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
harper-core = { version = "2.8", default-features = false }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
