[package]
name = "grammachy"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Companion CLI for the Grammachy Omarchy plugin"
license = "MIT"
publish = false

[[bin]]
name = "grammachy"
path = "src/main.rs"

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
